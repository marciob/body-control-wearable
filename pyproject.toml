[project]
name = "bodycontrol"
version = "0.1.0"
description = "Read your own WHOOP 5.0 over Bluetooth LE and compute your own metrics."
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
]

[project.scripts]
bodycontrol = "bodycontrol.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bodycontrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
